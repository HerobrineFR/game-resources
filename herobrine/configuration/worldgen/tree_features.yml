configured_feature:
  herobrine:ebony_tree:
    type: 'minecraft:tree'
    config:
      below_trunk_provider:
        type: 'minecraft:rule_based_state_provider'
        rules:
          - if_true:
              type: 'minecraft:not'
              predicate:
                type: 'minecraft:matching_block_tag'
                tag: 'minecraft:cannot_replace_below_tree_trunk'
            then:
              type: 'minecraft:simple_state_provider'
              state:
                Name: 'minecraft:dirt'
      decorators: []
      foliage_placer:
        type: 'minecraft:acacia_foliage_placer'
        offset: 1
        radius: 2
      foliage_provider:
        type: 'craftengine:simple_state_provider'
        state:
          Name: 'herobrine:ebony_leaves'
          Properties:
            distance: '7'
            persistent: 'false'
            waterlogged: 'false'
      ignore_vines: true
      minimum_size:
        type: 'minecraft:three_layers_feature_size'
        upper_size: 3
      trunk_placer:
        type: 'minecraft:fancy_trunk_placer'
        base_height: 10
        height_rand_a: 5
        height_rand_b: 2
      trunk_provider:
        type: 'craftengine:simple_state_provider'
        state:
          Name: 'herobrine:ebony_log'
          Properties:
            axis: 'y'
